server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'self'; form-action 'self' https://intake.clearlinetechmethods.com; frame-ancestors 'self'; object-src 'none'; upgrade-insecure-requests" always;

  location / {
    try_files $uri $uri/ =404;
  }

  location ~* \.(png|ico|xml|txt)$ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
  }
}

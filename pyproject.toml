[project]
name = "pews-ops-beta"
version = "0.1.0"
description = "Local-only church operations layer over read-only Planning Center data"
requires-python = ">=3.10"
dependencies = [
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "pydantic==2.12.5",
  "python-multipart==0.0.32",
  "starlette==1.3.1",
  "uvicorn==0.39.0",
]

[dependency-groups]
dev = [
    "axe-playwright-python>=0.1.8",
    "httpx2>=2.9.1",
    "playwright==1.55.0",
    "pytest==8.4.2",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
